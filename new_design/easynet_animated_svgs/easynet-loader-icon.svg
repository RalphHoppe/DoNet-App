<svg xmlns="http://www.w3.org/2000/svg" class="en-root en-loop en-icon" viewBox="180 120 910 790" width="455" height="395" role="img" aria-label="EasyNet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>EasyNet</title>
<style><![CDATA[
.en-root{--en-ink:#1d212c;--en-line:#e2e5eb;--T:2.8s;--ld:0s}
@media (prefers-color-scheme:dark){.en-root{--en-ink:#eef0f6;--en-line:#272c38}}
.en-splash{--ld:2.3s}.en-icon{--T:2s}
.en-root path{fill-rule:evenodd}
.en-dk,.en-ink{fill:var(--en-ink)}.en-bar,.en-or,.en-n circle{fill:url(#en-g)}.en-trk{fill:var(--en-line)}
.en-n,.en-n circle,.en-halo{transform-box:fill-box;transform-origin:center}
.en-rvs,.en-rvf{stroke-width:170}.en-rvs{stroke-dasharray:100 100}
.en-cg,.en-pg{opacity:0}.en-loading .en-pg{opacity:1}
.en-cm{fill:none;stroke-width:84}.en-t{stroke:#ffd37a;stroke-opacity:.55;stroke-dasharray:22 78}.en-h{stroke:#fff6d8;stroke-dasharray:6 94}
.en-pb{transform:translateX(-260px)}
.en-d1{--x:-110px;--y:-70px}.en-d2{--x:110px;--y:70px;--dl:.12s}.en-b1{--x:170px;--y:0px;--dl:.4s}.en-b2{--x:170px;--y:0px;--dl:.52s}
.en-play .en-dk,.en-play .en-bar{animation:en-slide .9s cubic-bezier(.16,1,.3,1) var(--dl,0s) both}
.en-play .en-rvs{stroke-dashoffset:100;animation:en-draw 1.1s .6s cubic-bezier(.3,0,.4,1) forwards}
.en-play .en-rvf{opacity:0;animation:en-fade .01s 1.75s forwards}
.en-play .en-n{animation:en-pop .7s cubic-bezier(.34,1.56,.64,1) var(--d) both}
.en-play .en-ch{animation:en-rise .7s cubic-bezier(.16,1,.3,1) calc(1.15s + var(--i)*.06s) both}
.en-play .en-halo{animation:en-fade 1.4s .6s both}
.en-play .en-pg{animation:en-fade .5s 1.9s forwards}
.en-loop .en-cg{animation:en-fade .5s var(--ld) forwards}
.en-loop .en-t{animation:en-o1 var(--T) linear var(--ld) infinite}
.en-loop .en-h{animation:en-o2 var(--T) linear var(--ld) infinite}
.en-loop .en-n circle{animation:en-pulse var(--T) ease-out calc(var(--ld) + var(--f)*var(--T) - .1s) infinite}
.en-loop .en-dr{animation:en-drift 2.6s ease-in-out var(--ld) infinite}.en-loop .en-r2{animation-delay:calc(var(--ld) + .35s)}
.en-loop .en-hw{animation:en-breathe 3.6s ease-in-out var(--ld) infinite}
.en-loop .en-pb{animation:en-pbs 1.5s cubic-bezier(.65,0,.35,1) var(--ld) infinite}
@keyframes en-slide{from{opacity:0;transform:translate(var(--x),var(--y))}to{opacity:1;transform:none}}
@keyframes en-draw{to{stroke-dashoffset:0}}
@keyframes en-fade{from{opacity:0}to{opacity:1}}
@keyframes en-pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
@keyframes en-rise{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
@keyframes en-o1{from{stroke-dashoffset:22}to{stroke-dashoffset:-78}}
@keyframes en-o2{from{stroke-dashoffset:6}to{stroke-dashoffset:-94}}
@keyframes en-pulse{0%{transform:scale(1)}5%{transform:scale(1.35)}18%,100%{transform:scale(1)}}
@keyframes en-drift{50%{transform:translateX(10px)}}
@keyframes en-breathe{50%{opacity:.5}}
@keyframes en-pbs{from{transform:translateX(-260px)}to{transform:translateX(620px)}}
@media (prefers-reduced-motion:reduce){.en-loop .en-cg,.en-loop .en-t,.en-loop .en-h,.en-loop .en-n circle,.en-loop .en-dr,.en-loop .en-hw,.en-loop .en-pb{animation:none}}
]]></style>
